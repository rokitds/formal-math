name: Learning course

# Checks the course in learning/: the Lean sheets compile (sorry allowed, they are exercises),
# the lessons follow learning/CLAUDE.md, and the site builds. On main, the site is published to
# GitHub Pages (Settings → Pages → Source: GitHub Actions).

on:
  pull_request:
    paths: ["learning/**", ".github/workflows/learning.yml"]
  push:
    branches: [main]
    paths: ["learning/**", ".github/workflows/learning.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean sheets compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: learning/lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build

  site:
    name: Site builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: learning/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build   # runs the lesson check first
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: learning/site/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [lean, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
